<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tabla interactiva para contar del 1 al 200</title>
  <style>
    :root {
      --bg: #000;
      --text: #fff;
      --highlight: #ff0000;
      --muted: #d0d0d0;
      --cell-border: #555;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      overflow-x: hidden;
    }

    header {
      width: min(100%, 1100px);
      margin-bottom: 18px;
    }

    h1 {
      font-size: 2rem;
      margin: 0 0 8px;
    }

    .instructions {
      font-size: 1.1rem;
      color: var(--muted);
      margin: 0;
    }

    .mode-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 16px 0 0;
    }

    .mode-button {
      min-width: 180px;
      padding: 12px 20px;
      border: 3px solid #fff;
      border-radius: 8px;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .mode-button[aria-pressed="true"] {
      background: #222;
      box-shadow: inset 0 0 0 2px #fff;
    }

    .mode-button:focus-visible {
      outline: 4px solid var(--highlight);
      outline-offset: 3px;
    }

    .status {
      font-size: 1.3rem;
      margin: 16px 0;
      font-weight: bold;
      min-height: 1.5em;
    }

    .chart {
      width: min(100%, 1100px);
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      grid-template-rows: repeat(5, 86px);
      gap: 10px;
    }

    .number-cell {
      width: 100%;
      height: 86px;
      border: 2px solid var(--cell-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      letter-spacing: 0;
      border-radius: 8px;
      background: #000;
      color: #fff;
      overflow: visible;
      white-space: nowrap;
      text-align: center;
      position: relative;
    }

    .number-cell.current {
      border-color: transparent;
    }

    .number-cell.current::after {
      content: "";
      position: absolute;
      inset: -5px;
      border: 8px solid var(--highlight);
      border-radius: 12px;
      pointer-events: none;
      z-index: 999;
    }

    @media (max-width: 700px) {
      body {
        padding: 12px;
      }

      .chart {
        gap: 6px;
        grid-template-rows: repeat(5, 56px);
      }

      .mode-controls {
        gap: 8px;
      }

      .mode-button {
        min-width: 150px;
        padding: 10px 14px;
        font-size: 1rem;
      }

      .number-cell {
        height: 56px;
        font-size: clamp(1.35rem, 5vw, 2rem);
      }
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>Tabla para contar: 1 a 200</h1>
    <p class="instructions">Presiona Enter o Espacio para pasar al siguiente número. Usa los botones, o presiona T para contar de diez en diez y O para contar de uno en uno. Presiona R para reiniciar.</p>
    <div class="mode-controls" role="group" aria-label="Opciones de conteo">
      <button class="mode-button" id="onesButton" type="button" aria-pressed="true">Contar de uno en uno</button>
      <button class="mode-button" id="tensButton" type="button" aria-pressed="false">Contar de diez en diez</button>
    </div>
    <div class="status" id="status" aria-hidden="true">Número actual: 0</div>
  </header>

  <main class="chart" id="chart" tabindex="-1" lang="es" aria-label="Tabla interactiva para contar, mostrando 50 números a la vez"></main>

  <div id="announcement" class="sr-only" lang="es" aria-live="assertive" aria-atomic="true"></div>

  <script>
    const chart = document.getElementById('chart');
    const status = document.getElementById('status');
    const announcement = document.getElementById('announcement');
    const onesButton = document.getElementById('onesButton');
    const tensButton = document.getElementById('tensButton');
    const maxNumber = 200;
    const numbersPerPage = 50;
    const countModes = {
      ones: {
        label: 'ones',
        step: 1,
        firstNumber: 1
      },
      tens: {
        label: 'tens',
        step: 10,
        firstNumber: 10
      }
    };


    function numberToSpanish(number) {
      const ones = [
        'cero', 'uno', 'dos', 'tres', 'cuatro', 'cinco', 'seis', 'siete', 'ocho', 'nueve',
        'diez', 'once', 'doce', 'trece', 'catorce', 'quince', 'dieciséis', 'diecisiete',
        'dieciocho', 'diecinueve'
      ];

      const tensWords = {
        20: 'veinte',
        30: 'treinta',
        40: 'cuarenta',
        50: 'cincuenta',
        60: 'sesenta',
        70: 'setenta',
        80: 'ochenta',
        90: 'noventa'
      };

      if (number < 20) {
        return ones[number];
      }

      if (number === 20) {
        return 'veinte';
      }

      if (number > 20 && number < 30) {
        const veintiWords = {
          21: 'veintiuno',
          22: 'veintidós',
          23: 'veintitrés',
          24: 'veinticuatro',
          25: 'veinticinco',
          26: 'veintiséis',
          27: 'veintisiete',
          28: 'veintiocho',
          29: 'veintinueve'
        };
        return veintiWords[number];
      }

      if (number < 100) {
        const tens = Math.floor(number / 10) * 10;
        const unit = number % 10;
        return unit === 0 ? tensWords[tens] : `${tensWords[tens]} y ${ones[unit]}`;
      }

      if (number === 100) {
        return 'cien';
      }

      if (number < 200) {
        return `ciento ${numberToSpanish(number - 100)}`;
      }

      if (number === 200) {
        return 'doscientos';
      }

      return String(number);
    }

    function announceNumber(number) {
      return numberToSpanish(number);
    }

    let countMode = 'ones';
    let currentNumber = countModes[countMode].firstNumber;
    let hasStarted = false;

    function getPageStart(number) {
      return Math.floor((number - 1) / numbersPerPage) * numbersPerPage + 1;
    }

    function updateModeButtons() {
      onesButton.setAttribute('aria-pressed', countMode === 'ones' ? 'true' : 'false');
      tensButton.setAttribute('aria-pressed', countMode === 'tens' ? 'true' : 'false');
    }

    function renderChart() {
      updateModeButtons();
      chart.innerHTML = '';
      const pageStart = getPageStart(currentNumber);
      const pageEnd = Math.min(pageStart + numbersPerPage - 1, maxNumber);

      for (let number = pageStart; number <= pageEnd; number += 1) {
        const cell = document.createElement('div');
        cell.className = 'number-cell';
        cell.textContent = number;
        cell.setAttribute('role', 'text');
        cell.setAttribute('lang', 'es');
        cell.setAttribute('aria-label', numberToSpanish(number));

        if (hasStarted && number === currentNumber) {
          cell.classList.add('current');
        }

        chart.appendChild(cell);
      }

      const displayedNumber = hasStarted ? currentNumber : 0;
      status.textContent = `Número actual: ${displayedNumber}`;
      announcement.textContent = hasStarted ? announceNumber(currentNumber) : '';
    }

    function resetCountingPosition() {
      currentNumber = countModes[countMode].firstNumber;
      hasStarted = false;
    }

    function nextNumber() {
      const currentMode = countModes[countMode];

      if (!hasStarted) {
        currentNumber = currentMode.firstNumber;
        hasStarted = true;
        renderChart();
        return;
      }

      if (currentNumber + currentMode.step <= maxNumber) {
        currentNumber += currentMode.step;
        renderChart();
      } else {
        announcement.textContent = announceNumber(currentNumber);
      }
    }

    function restart() {
      resetCountingPosition();
      renderChart();
      announcement.textContent = 'cero';
    }

    function changeCountingMode(newMode) {
      if (!countModes[newMode]) {
        return;
      }

      countMode = newMode;
      resetCountingPosition();
      renderChart();
      announcement.textContent = countMode === 'tens' ? 'Contando de diez en diez' : 'Contando de uno en uno';
    }

    function focusChartAfterModeChange() {
      requestAnimationFrame(() => {
        chart.focus({ preventScroll: true });
      });
    }

    function activateModeButton(newMode) {
      changeCountingMode(newMode);
      focusChartAfterModeChange();
    }

    function handleModeButtonKeydown(event, newMode) {
      if (event.key === 'Enter' || event.key === ' ' || event.code === 'Space') {
        event.preventDefault();
        event.stopPropagation();
        activateModeButton(newMode);
      }
    }

    onesButton.addEventListener('click', () => {
      activateModeButton('ones');
    });

    tensButton.addEventListener('click', () => {
      activateModeButton('tens');
    });

    onesButton.addEventListener('keydown', (event) => {
      handleModeButtonKeydown(event, 'ones');
    });

    tensButton.addEventListener('keydown', (event) => {
      handleModeButtonKeydown(event, 'tens');
    });

    document.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();

      if (event.key === 'Enter' || event.key === ' ' || event.code === 'Space') {
        event.preventDefault();
        nextNumber();
      }

      if (key === 't') {
        event.preventDefault();
        changeCountingMode('tens');
      }

      if (key === 'o') {
        event.preventDefault();
        changeCountingMode('ones');
      }

      if (key === 'r') {
        event.preventDefault();
        restart();
      }
    });

    renderChart();
  </script>
</body>
</html>
